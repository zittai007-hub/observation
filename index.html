<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Implementing Squirrel - Final Fix</title>
<link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ---- 全体設定 -------------------------------------------------- */
body {
    font-family: "Cutive Mono", "Orbitron", monospace;
    background: #ffffff;
    margin: 0; padding: 0; color: #111;
    height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center;
    user-select: none;
}

/* ---- 外枠レイヤー ---------------------------------------------- */
#outer-layers-container {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
    display: flex; justify-content: center; align-items: center;
}
.outer-frame {
    position: absolute; width: 95%; max-width: 1200px; 
    height: calc(100vh - 140px);
    top: 20px;
    border: 2px solid #000; background: rgba(255, 255, 255, 0.4);
    box-shadow: 0 0 20px rgba(0,0,0,0.1); border-radius: 4px;
    display: flex; flex-direction: column; justify-content: space-between;
    transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.outer-frame::before {
    content: "System Layer [OUTER]"; display: block; padding: 8px;
    background: #f0f0f0; border-bottom: 2px solid #000; font-size: 12px; font-weight: bold;
}

/* ---- 下部固定バー (Bottom HUD) --------------------------------- */
#bottom-hud {
    position: fixed; bottom: 0; left: 0; width: 100%; height: 110px;
    background: #fff; border-top: 3px solid #000;
    z-index: 3000;
    display: flex; align-items: center; justify-content: center; gap: 20px;
    padding: 10px; box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
    box-sizing: border-box;
}

.hud-panel {
    background: #fff; border: 2px solid #000; padding: 8px 15px;
    box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
    display: flex; flex-direction: column; justify-content: center;
    height: 100%; box-sizing: border-box;
    min-width: 120px; position: relative;
}
.hud-label { font-size: 9px; font-weight: bold; color: #555; letter-spacing: 1px; margin-bottom: 3px; }
.hud-value { font-size: 20px; font-weight: 900; font-family: "Orbitron"; line-height: 1; }
.hud-value.depth { font-size: 28px; }
.hud-value.depth.dream { color: #e91e63; }
.hud-value.depth.wake { color: #0056b3; }

/* Stabilized Indicator */
#stabilizer-indicator {
    position: absolute; top: -10px; right: -10px;
    background: #00c853; color: #fff; font-size: 9px; padding: 2px 6px;
    border: 1px solid #000; display: none; font-weight: bold;
    animation: pulse 1s infinite;
}
@keyframes pulse { 0%{opacity:1;} 50%{opacity:0.5;} 100%{opacity:1;} }

.item-slot {
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; padding: 5px; border: 1px solid transparent; transition: 0.2s;
}
.item-slot:hover { background: #eee; border-color: #ccc; }
.item-icon { font-size: 24px; }
.item-qty { font-weight: bold; font-family: "Orbitron"; font-size: 18px; }

.hud-passive-list { 
    display: flex; flex-wrap: wrap; gap: 5px; max-width: 300px; 
    overflow-y: auto; max-height: 60px;
}
.hud-passive-badge {
    font-size: 10px; padding: 2px 5px; background: #000; color: #fff;
    display: flex; gap: 5px; align-items: center; border-radius: 2px;
}
.durability-dots { display: flex; gap: 1px; }
.dot { width: 3px; height: 3px; background: #0f0; border-radius: 50%; }

/* ---- メインコンテンツ ------------------------------------------ */
#container {
    width: 95%; max-width: 1200px; 
    height: calc(100vh - 140px);
    margin-top: 20px;
    position: relative; z-index: 100; background: #fff; 
    border: 3px solid #000; border-radius: 4px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    display: flex; flex-direction: column;
    transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    overflow: hidden; 
}

#header {
    flex: 0 0 auto; padding: 12px 16px; font-size: 20px; font-weight: bold;
    background: #fff; border-bottom: 3px solid #000;
    display: flex; justify-content: space-between; align-items: center;
}

#main-content-area {
    flex: 1 1 auto; padding: 20px; overflow-y: auto; position: relative;
    background-image: radial-gradient(#ddd 1px, transparent 1px); background-size: 20px 20px;
}

#main-log-window {
    height: 150px; padding: 10px; margin-bottom: 20px; background: #fff;
    border: 2px solid #000; font-size: 0.9rem; overflow-y: auto;
    box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
}

#dream-container {
    display: flex; flex-wrap: wrap; gap: 15px; justify-content: flex-start; padding-bottom: 40px;
}

#footer {
    flex: 0 0 auto; padding: 5px 20px; background: #fff; border-top: 3px solid #000;
    display: flex; justify-content: flex-end; font-size: 0.9rem; font-weight: bold;
}

/* ---- 夢ウィンドウ ---------------------------------------------- */
.sub-window {
    width: 240px; height: 160px; background: #fff; border: 2px solid #000;
    display: flex; flex-direction: column; animation: popIn 0.4s ease; flex-grow: 1;
    box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
}
@keyframes popIn { from {transform:scale(0.8); opacity:0;} to {transform:scale(1); opacity:1;} }
.sub-header { background: #000; padding: 5px 10px; font-size: 0.8rem; color: #fff; display: flex; justify-content: space-between; font-weight: bold;}
.sub-log-area { flex: 1; padding: 5px; overflow-y: auto; font-size: 0.8rem; color: #333; }
.dream-active .sub-header { background: #e91e63; }

/* ---- パッシブ選択モーダル -------------------------------------- */
#passive-modal {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255,255,255,0.95); z-index: 5000;
    display: none; flex-direction: column; justify-content: center; align-items: center;
}
.passive-choice-container {
    display: flex; gap: 20px; margin-top: 20px;
}
.passive-card {
    width: 200px; height: 260px; border: 3px solid #000; background: #fff;
    padding: 15px; cursor: pointer; transition: 0.2s;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    box-shadow: 5px 5px 0px rgba(0,0,0,0.2); position: relative;
}
.passive-card:hover { transform: translateY(-5px); box-shadow: 8px 8px 0px rgba(0,0,0,0.3); background: #f9f9f9; }
.passive-card.owned { opacity: 0.5; pointer-events: none; border-color: #999; }
.passive-card.owned::after { content: "OWNED"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(-15deg); font-size: 24px; color: #999; border: 2px solid #999; padding: 5px; }

.p-icon { font-size: 40px; margin-bottom: 10px; }
.p-name { font-weight: 900; margin-bottom: 10px; font-family: "Orbitron"; }
.p-desc { font-size: 12px; color: #555; }
.p-level { margin-top: auto; font-weight: bold; background: #000; color: #fff; padding: 2px 10px; }

#modal-current-passives {
    margin-top: 20px; padding: 10px; border-top: 2px dashed #ccc; width: 80%; text-align: center;
}
.modal-badge { display: inline-block; padding: 2px 6px; background: #000; color: #fff; font-size: 10px; margin: 2px; }

/* ---- アイテム使用モーダル -------------------------------------- */
#item-modal {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: #fff; border: 3px solid #000; padding: 20px; z-index: 6000;
    display: none; flex-direction: column; align-items: center; box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
}

/* ---- その他UI -------------------------------------------------- */
button {
    background: #fff; color: #000; border: 2px solid #000; padding: 5px 15px;
    font-family: inherit; font-weight: bold; cursor: pointer; transition: 0.2s;
    box-shadow: 2px 2px 0px #000;
}
button:hover { transform: translate(1px, 1px); box-shadow: 1px 1px 0px #000; }

.log-line { margin-bottom: 3px; border-bottom: 1px dotted #eee; }
.log-line.awaken { color: #0056b3; } 
.log-line.system { font-weight: bold; }

/* 清算演出 */
#settlement-ui { position: absolute; top: 60px; right: 20px; display: flex; flex-direction: column; align-items: center; z-index: 500; }
#settlement-count { font-size: 28px; color: #000; font-weight: 900; background:#fff; padding:0 10px; border: 2px solid #000; margin-bottom: 5px; }
#settlement-box { width: 60px; height: 60px; border: 3px solid #000; display:flex; justify-content:center; align-items:center; background:#fff; position:relative; box-shadow: 4px 4px 0px rgba(0,0,0,0.2); }
.box-shake { animation: shake 0.1s ease; }
@keyframes shake { 0%{transform:scale(1);} 50%{transform:scale(1.1);} 100%{transform:scale(1);} }
.sucking-log { position: absolute; color: #555; font-size: 10px; pointer-events: none; font-weight:bold; }

/* 図鑑 */
#zukan-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 6000; display: none; justify-content: center; align-items: center; }
#zukan-content { width: 80%; height: 80%; background: #fff; border: 4px solid #000; padding: 20px; overflow-y: auto; position: relative; box-shadow: 10px 10px 0px rgba(0,0,0,0.1); }
.achievement-item { border-bottom: 2px solid #eee; padding: 15px; display: flex; align-items: center; opacity: 0.4; }
.achievement-item.unlocked { opacity: 1; background: #f9f9f9; border-left: 6px solid #000; }
.ach-icon { font-size: 24px; margin-right: 15px; width: 40px; text-align: center; }

#toast { position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%); background: #000; color: #fff; padding: 15px 30px; display: none; z-index: 7000; animation: slideUp 0.5s ease; border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); font-weight: bold; }
@keyframes slideUp { from{transform:translate(-50%,20px);opacity:0;} to{transform:translate(-50%,0);opacity:1;} }

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #f0f0f0; border-left: 1px solid #ccc; }
::-webkit-scrollbar-thumb { background: #333; }

</style>
</head>

// ズームアウト演出
function updateZoomOutEffect(depth) {
    const scale = Math.max(0.4, 1 - (depth * 0.1)); 
    container.style.transform = `scale(${scale})`;
    outerLayers.innerHTML = "";
    for (let i = depth; i >= 1; i--) {
        const frame = document.createElement("div");
        frame.className = "outer-frame";
        const layerScale = 1 - ((i - 1) * 0.1);
        frame.style.transform = `scale(${layerScale})`;
        frame.style.borderColor = `rgba(0,0,0, ${1 - (i*0.1)})`;
        frame.style.zIndex = -i; 
        frame.innerHTML = `<div style="padding:10px; color:#000; font-size:10px; font-weight:bold;">>> RECURSION DEPTH -${i} <<</div>`;
        outerLayers.appendChild(frame);
    }
}

// パッシブ選択画面
function showPassiveSelection(level) {
    isPaused = true;
    updatePassiveDisplay();
    passiveChoices.innerHTML = "";
    
    const shuffled = [...passiveDatabase].sort(() => 0.5 - Math.random());
    const choices = shuffled.slice(0, 3);
    
    let allOwned = true;
    choices.forEach(p => { if (activePassives[p.id].level < level) allOwned = false; });

    choices.forEach(p => {
        const isOwned = activePassives[p.id].level >= level;
        const div = document.createElement("div");
        div.className = `passive-card ${isOwned ? 'owned' : ''}`;
        div.innerHTML = `<div class="p-icon">${p.icon}</div><div class="p-name">${p.name}</div><div class="p-desc">${p.desc[level-1]}</div><div class="p-level">LEVEL ${level}</div>`;
        if (!isOwned) {
            div.onclick = () => {
                activePassives[p.id].level = level; activePassives[p.id].durability = 3;
                addLog(`Patch Applied: ${p.name} Lv${level}`, "system");
                updatePassiveDisplay(); passiveModal.style.display = "none"; isPaused = false;
            };
            passiveChoices.appendChild(div);
        }
    });

    if (passiveChoices.childElementCount === 0 || allOwned) {
        passiveChoices.innerHTML = "";
        const div = document.createElement("div");
        div.className = "passive-card";
        div.style.borderColor = "#6ab0ff";
        div.innerHTML = `<div class="p-icon">🧬</div><div class="p-name">Dream Shifter</div><div class="p-desc">Modify Dream Counter (+1/-1)<br>Consumable Item</div><div class="p-level" style="background:#6ab0ff;">ITEM</div>`;
        div.onclick = () => {
            inventory.shifter++; hudShifter.textContent = "x" + inventory.shifter;
            addLog(`Item Acquired: Dream Shifter`, "system");
            passiveModal.style.display = "none"; isPaused = false;
        };
        passiveChoices.appendChild(div);
    }
    passiveModal.style.display = "flex";
}

// ウィンドウ管理（即時実行用）
function manageDreamWindows() {
    if(dreamCounter <= 0) {
        Object.keys(activeWindows).forEach(k => closeDreamWindow(k));
        return;
    }
    
    let extraWindows = 0;
    if (activePassives.multithread.level === 1) extraWindows = 2;
    if (activePassives.multithread.level === 2) extraWindows = 5;
    if (activePassives.multithread.level === 3) extraWindows = 10;
    const targetCount = dreamCounter + extraWindows;
    const currentCount = Object.keys(activeWindows).length;
    
    if (currentCount < targetCount) {
        for (let i = currentCount + 1; i <= targetCount; i++) openDreamWindow(i);
    } else if (currentCount > targetCount) {
         const keys = Object.keys(activeWindows).map(Number).sort((a,b)=>b-a);
         for(let i=0; i < currentCount - targetCount; i++) closeDreamWindow(keys[i]);
    }
}

// 0クロス処理（即時実行用）
function handleZeroCrossing(oldCounter) {
    if (oldCounter > 0) {
        addLog("現実へ帰還。ログ精算...", "system");
        // ウィンドウを強制クローズしてログ回収
        Object.keys(activeWindows).forEach(k => closeDreamWindow(k));
        // 即時精算実行
        checkAchievements();
    } else {
        addLog("覚醒深度リセット。", "awaken");
    }
}

    if (inventory.shifter > 0) {

        const oldCounter = dreamCounter;
        dreamCounter += amount;
        addLog(`Dream Shifter used: Counter ${amount > 0 ? '+1' : '-1'}`, "system");
        
        closeItemModal();
        
        // ★重要: メインタイマーをリセットし、即時実行による競合を防ぐ
        clearInterval(mainLoopTimer);
        mainLoopTimer = setInterval(updateCounter, 2500);

        // ★重要: 視覚状態を即時更新
        updateVisualState();
        
        // Stabilizerモード判定 (アイテムで10に行っても発動させる)
        if (activePassives.stabilizer.level > 0 && dreamCounter >= 10 && !isStabilized) {
            isStabilized = true;
            addLog("STABILIZER: Return Mode Activated.", "system");
            updateVisualState();
        }

        // ★重要: ロジックの即時実行
        if (oldCounter !== 0 && dreamCounter === 0) {
            handleZeroCrossing(oldCounter);
        } else {
            manageDreamWindows();
        }
    }
}

// カウンター更新ループ（メイン）
function updateCounter() {
    if (isSettling || isPaused) return;

    const oldCounter = dreamCounter;
    let delta = 0;

    // Stabilizerロジック
    if (activePassives.stabilizer.level > 0 && dreamCounter >= 10) {
        if (!isStabilized) {
            isStabilized = true;
            addLog("STABILIZER: Return Mode Activated.", "system");
        }
    }

    // 確率計算
    if (isStabilized) {
        const lv = activePassives.stabilizer.level;
        const r = Math.random();
        if (lv === 1) {
            if (r < 0.2) delta = 1; else if (r < 0.5) delta = 0; else delta = -1;
        } else if (lv === 2) {
            if (r < 0.1) delta = 1; else if (r < 0.4) delta = 0; else delta = -1;
        } else {
            if (r < 0.2) delta = 0; else delta = -1;
        }
    } else {
        delta = Math.floor(Math.random() * 3) - 1; 
    }

    dreamCounter += delta;

    // パッシブ獲得
    if (dreamCounter === -3 && oldCounter !== -3) showPassiveSelection(1);
    else if (dreamCounter === -8 && oldCounter !== -8) showPassiveSelection(2);
    else if (dreamCounter === -13 && oldCounter !== -13) showPassiveSelection(3);

    // クラッシュ
    if (dreamCounter >= 15 || dreamCounter <= -15) {
        dreamCounter = 0;
        isStabilized = false;
        for(let k in activePassives) { activePassives[k].level=0; activePassives[k].durability=0; }
        updatePassiveDisplay();
        addLog("SYSTEM CRASH: Resetting...", "chaos");
        playFinishSound();
    }

    // 更新処理を共通化
    updateVisualState();

    if (oldCounter !== 0 && dreamCounter === 0) {
        handleZeroCrossing(oldCounter);
    } else {
        manageDreamWindows();
    }
    
    if (Math.random() > 0.6 && !isPaused && dreamCounter !== 0) {
        if (dreamCounter < 0) addLog(`System: ${logsSystem[Math.floor(Math.random()*logsSystem.length)]}`, "awaken");
    }
}

// 夢ウィンドウ
function openDreamWindow(depth) {
    if (activeWindows[depth]) return;
    let cName, idx;
    const lvl = activePassives.targeting.level;
    if (lvl > 0) {
        let chance = (lvl === 1) ? 0.5 : (lvl === 2) ? 0.8 : 1.0;
        if (Math.random() < chance) {
            cName = targetCreatures[Math.floor(Math.random() * targetCreatures.length)];
            idx = logsCreature.indexOf(cName);
        } else {
            idx = Math.floor(Math.random()*logsCreature.length);
            cName = logsCreature[idx];
        }
    } else {
        idx = Math.floor(Math.random()*logsCreature.length);
        cName = logsCreature[idx];
    }
    const type = getCreatureType(idx);

    const div = document.createElement("div");
    div.className = "sub-window dream-active";
    div.id = `win-${depth}`;
    div.innerHTML = `<div class="sub-header"><span>#${depth}: ${cName}</span><span id="cnt-${depth}">0</span></div><div class="sub-log-area" id="log-area-${depth}"></div>`;
    dreamArea.appendChild(div);
    
    activeWindows[depth] = { el: div, creature: cName, type: type, idx: idx, count: 0, timer: null, state: "NORMAL", stateTimer: 0 };
    
    let speed = 2000 + Math.random()*2000;
    const oLvl = activePassives.overclock.level;
    if (oLvl === 1) speed /= 1.5; if (oLvl === 2) speed /= 3.0; if (oLvl === 3) speed /= 10.0;
    activeWindows[depth].timer = setInterval(()=>{ generateSubLog(depth); }, speed);
}

function closeDreamWindow(depth) {
    const w = activeWindows[depth]; if (!w) return;
    clearInterval(w.timer);
    log_corrector.push({ creature: w.creature, count: w.count, type: w.type });
    w.el.style.transform = "scale(0)";
    setTimeout(() => { if(w.el.parentNode) w.el.parentNode.removeChild(w.el); }, 300);
    delete activeWindows[depth];
}

function generateSubLog(depth) {
    const w = activeWindows[depth]; if (!w) return;
    const data = actionData[w.type];
    let text = ""; let css = "log-line";
    if (w.state === "SLEEP") {
        w.stateTimer--; if (w.stateTimer <= 0) { w.state = "NORMAL"; text = w.creature + data.wakeUp; } else { text = w.creature + data.sleeping; css += " sleep"; }
    } else if (w.state === "EAT") {
        w.stateTimer--; if (w.stateTimer <= 0) { w.state = "NORMAL"; text = w.creature + data.eatEnd; } else { text = w.creature + data.eating[Math.floor(Math.random()*data.eating.length)]; css += " eat"; }
    } else {
        if (Math.random() < 0.1) {
             const r = Math.random();
             if(r<0.1) { w.state="SLEEP"; w.stateTimer=5; text=w.creature+data.sleepStart; }
             else if(r<0.3) { w.state="EAT"; w.stateTimer=3; text=w.creature+data.eatStart; }
             else text = w.creature + data.normal[Math.floor(Math.random()*data.normal.length)];
        } else {
            ram = Math.floor(Math.random() * 3)
            const baseIdx = w.idx * 3;
            const o = ram
            const a = ram
            text = `${w.creature}は${logsObjects[baseIdx + o]}を${logsActions[baseIdx + a]}`;
        }
    }
    const area = document.getElementById(`log-area-${depth}`);
    const div = document.createElement("div"); div.className=css; div.textContent=`> ${text}`;
    area.appendChild(div); area.scrollTop = area.scrollHeight;
    w.count++; document.getElementById(`cnt-${depth}`).textContent = w.count;
}

// 実績精算
function checkAchievements() {
    if (log_corrector.length === 0) {
        isStabilized = false;
        return;
    }
    isSettling = true;
    isStabilized = false; // 解除
    
    let lotteryProb = 0.2; let conditionMult = 1;
    const rngLvl = activePassives.rng_hack.level;
    if (rngLvl === 1) lotteryProb *= 1.2; if (rngLvl === 2) lotteryProb *= 2.0; if (rngLvl === 3) { lotteryProb = 1.0; conditionMult = 50; }

    const box = document.getElementById("settlement-box");
    const countEl = document.getElementById("settlement-count");
    const total = log_corrector.reduce((a,b)=>a+b.count,0);
    
    totalLogsAllTime += total;
    localStorage.setItem("squirrel_total_logs", totalLogsAllTime);
    hudTotalLogs.textContent = totalLogsAllTime;

    let c = 0;
    let toothElephantFlag=false, toothHippoFlag=false;

    log_corrector.forEach(log => {
        const cName = log.creature;
        for(let i=0; i<log.count; i++) {
            if (Math.random() < lotteryProb) { 
                if(["オオカミ","カワウソ","コウモリ","キツツキ","ゾウガメ"].includes(cName)) achievementProgress.extinctionCount++;
                if(cName==="ゾウ") toothElephantFlag=true;
                if(cName==="カバ") toothHippoFlag=true;
                if(cName==="トラ" && Math.random() < 0.1 * conditionMult) achievementProgress.huntTiger=true;
                if(cName==="ライオン" && Math.random() < 0.05 * conditionMult) achievementProgress.huntLion=true;
                if(cName==="ドングリ" && Math.random() < 0.006 * conditionMult) unlockById("miracle_growth");
                if(cName==="カイウサギ" && Math.floor(Math.random()*100)+1===1) achievementProgress.jumpRabbit=true;
                if(cName==="アマガエル" && Math.floor(Math.random()*100)+1===1) achievementProgress.jumpFrog=true;
                if(cName==="アカカンガルー" && Math.floor(Math.random()*100)+1===10) achievementProgress.jumpKangaroo=true;
                if(cName==="キリン" && Math.floor(Math.random()*100)+1===50) achievementProgress.tongueGiraffe=true;
                if(cName==="マレーグマ" && Math.floor(Math.random()*100)+1===25) achievementProgress.tongueBear=true;
                if(cName==="チューリップ" && Math.floor(Math.random()*6)+1===3) unlockById("tulip_self");
                if(cName==="クローバー" && Math.floor(Math.random()*100)+1===56) unlockById("max_clover");
                if(cName==="ホシガメ" && Math.floor(Math.random()*100)+1===29) unlockById("turtle_temp");
                if(cName==="アヒル" && Math.floor(Math.random()*100)+1===12) unlockById("duck_imprint");
            }
        }
    });

    if(toothElephantFlag && toothHippoFlag) unlockById("tooth_collection");
    achievementList.forEach(ach => { if(!unlockedAchievements.has(ach.id) && ach.condition()) unlockAchievement(ach); });
    saveProgress();

    // 耐久値減少
    for(let k in activePassives) {
        if(activePassives[k].level > 0) {
            activePassives[k].durability--;
            if(activePassives[k].durability <= 0) {
                activePassives[k].level = 0; activePassives[k].durability = 0;
                addLog(`Passive Expired: ${passiveDatabase.find(p=>p.id===k).name}`, "system");
            }
        }
    }
    updatePassiveDisplay();

    const timer = setInterval(() => {
        c += Math.ceil(total / 30); if(c > total) c = total;
        countEl.textContent = c; playBlip();
        const p = document.createElement("div"); p.className = "sucking-log"; p.textContent = "> log";
        p.style.transform = `translateX(${Math.random()*40-20}px)`; box.appendChild(p);
        p.animate([{top:'-30px',opacity:1},{top:'20px',opacity:0,transform:'scale(0.1)'}],{duration:300}).onfinish=()=>p.remove();
        box.classList.remove("box-shake"); void box.offsetWidth; box.classList.add("box-shake");

        if(c >= total) {
            clearInterval(timer); playFinishSound(); log_corrector=[];
            setTimeout(() => { isSettling = false; countEl.textContent="0"; }, 1500);
        }
    }, 50);
}

function unlockById(id) { const ach = achievementList.find(a=>a.id===id); if(ach && !unlockedAchievements.has(id)) unlockAchievement(ach); }
function unlockAchievement(ach) {
    unlockedAchievements.add(ach.id); addLog(`実績解除: [${ach.title}]`, "system");
    const t = document.getElementById("toast"); t.textContent = `Unlocked: ${ach.title}`; t.style.display = "block"; setTimeout(()=>t.style.display="none", 3000);
}

let audioCtx = null;
function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function playBlip() {
    if(!audioCtx) return; if(audioCtx.state==='suspended') audioCtx.resume();
    const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=800; g.gain.value=0.05; o.start(); o.stop(audioCtx.currentTime+0.05);
}
function playFinishSound() {
    if(!audioCtx) return;
    [440,554,659].forEach((f,i)=>{
        const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination); o.type='triangle'; o.frequency.value=f;
        g.gain.setValueAtTime(0, audioCtx.currentTime+i*0.1);
        g.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime+i*0.1+0.05);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+i*0.1+0.5);
        o.start(audioCtx.currentTime+i*0.1); o.stop(audioCtx.currentTime+i*0.1+0.5);
    });
}

// 実績設定
let achievementProgress = { extinctionCount: 0, huntTiger: false, huntLion: false, jumpRabbit: false, jumpFrog: false, jumpKangaroo: false, tongueGiraffe: false, tongueBear: false };
if(localStorage.getItem("squirrel_progress")) achievementProgress = JSON.parse(localStorage.getItem("squirrel_progress"));
let unlockedAchievements = new Set();
if(localStorage.getItem("squirrel_achievements")) JSON.parse(localStorage.getItem("squirrel_achievements")).forEach(id=>unlockedAchievements.add(id));
function saveProgress() { localStorage.setItem("squirrel_progress", JSON.stringify(achievementProgress)); localStorage.setItem("squirrel_achievements", JSON.stringify([...unlockedAchievements])); }
const achievementList = [
    { id: "extinction_100", title: "1日100以上の動物を絶滅させる", desc: "オオカミ・カワウソ・コウモリ・キツツキ・ゾウガメの寿命を100回終わらせる", icon: "💀", condition: () => achievementProgress.extinctionCount >= 100 },
    { id: "tooth_collection", title: "ずっと伸び伸び", desc: "ゾウとカバの歯に関するログを同時に集める", icon: "🦷", condition: () => false },
    { id: "hunting_time", title: "狩りの時間", desc: "トラとライオンが狩りに成功する", icon: "🍖", condition: () => achievementProgress.huntTiger && achievementProgress.huntLion },
    { id: "broad_jump", title: "立ち幅跳び", desc: "カイウサギ・アマガエル(1m)、アカカンガルー(10m)の飛距離を観測する", icon: "🐇", condition: () => achievementProgress.jumpRabbit && achievementProgress.jumpFrog && achievementProgress.jumpKangaroo },
    { id: "miracle_growth", title: "無事に育つって奇跡", desc: "ドングリを発芽させ、無事に育たせる", icon: "🌱", condition: () => false },
    { id: "long_tongue", title: "ながーい舌", desc: "キリンとマレーグマの舌を眺める", icon: "👅", condition: () => achievementProgress.tongueGiraffe && achievementProgress.tongueBear },
    { id: "tulip_self", title: "花の魅力は半減せず", desc: "チューリップに3枚の花弁を自覚させる", icon: "🌷", condition: () => false },
    { id: "max_clover", title: "最大枚数", desc: "56枚葉のクローバーを観測する", icon: "🍀", condition: () => false },
    { id: "turtle_temp", title: "どっちなんだい？！", desc: "ホシガメに29℃で産卵させる", icon: "🐢", condition: () => false },
    { id: "duck_imprint", title: "親の顔より見た他人", desc: "アヒルに正しい親を認識させる", icon: "🦆", condition: () => false }
];

// 図鑑UI
const modal = document.getElementById("zukan-modal");
const listEl = document.getElementById("achievement-list");
document.getElementById("btn-zukan").onclick = () => {
    initAudio(); if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    listEl.innerHTML = "";
    achievementList.forEach(ach => {
        const u = unlockedAchievements.has(ach.id);
        const d = document.createElement("div"); d.className = `achievement-item ${u?'unlocked':''}`;
        d.innerHTML = `<div class="ach-icon">${u?ach.icon:"?"}</div><div class="ach-info"><h3>${u?ach.title:"?????"}</h3><p>${u?ach.desc:"Locked"}</p></div>`;
        listEl.appendChild(d);
    });
    modal.style.display = "flex";
};
document.getElementById("zukan-close").onclick = () => modal.style.display = "none";

// 開始
addLog("システム起動...");
initAudio();
// タイマーを変数に格納して管理
mainLoopTimer = setInterval(updateCounter, 2500);

</script>
